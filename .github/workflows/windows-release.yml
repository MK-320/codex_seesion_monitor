name: Windows release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_unsigned_verify:
        description: Run the Windows NSIS validation package
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  change-scope:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run_unsigned: ${{ steps.scope.outputs.run_unsigned }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Decide whether an installer build is required
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_UNSIGNED_VERIFY: ${{ inputs.run_unsigned_verify }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_unsigned=$RUN_UNSIGNED_VERIFY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(src/|frontend/src/|frontend/src-tauri/|frontend/public/|frontend/package\.json$|frontend/package-lock\.json$|frontend/vite\.|frontend/tsconfig|frontend/index\.html$|scripts/|pyproject\.toml$|uv\.lock$|\.github/workflows/windows-release\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run_unsigned=true" >> "$GITHUB_OUTPUT"
            echo "Installer-affecting files changed:"
            grep -E '^(src/|frontend/src/|frontend/src-tauri/|frontend/public/|frontend/package\.json$|frontend/package-lock\.json$|frontend/vite\.|frontend/tsconfig|frontend/index\.html$|scripts/|pyproject\.toml$|uv\.lock$|\.github/workflows/windows-release\.yml$)' "$RUNNER_TEMP/changed-files.txt"
          else
            echo "run_unsigned=false" >> "$GITHUB_OUTPUT"
            echo "No installer-affecting files changed; skipping NSIS build."
          fi

  unsigned-verify:
    needs: change-scope
    if: github.event_name != 'push' && (needs.change-scope.result == 'failure' || needs.change-scope.outputs.run_unsigned == 'true')
    runs-on: windows-latest
    steps:
      - name: Fail closed when change scope detection fails
        if: needs.change-scope.result == 'failure'
        shell: pwsh
        run: throw "Unable to determine whether the pull request requires an installer validation build."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b
        with:
          version: "0.6.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache Rust and Tauri build data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-tauri-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-
      - name: Install build dependencies
        run: uv sync --dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build sidecar before bundle
        run: pwsh -NoProfile -File scripts/build-sidecar.ps1
      - name: Disable updater artifacts for unsigned validation
        shell: pwsh
        run: |
          @{ bundle = @{ createUpdaterArtifacts = $false } } |
            ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/tauri.unsigned.conf.json" -Encoding utf8
      - name: Build unsigned NSIS validation package
        working-directory: frontend
        run: npm exec tauri build -- --config src-tauri/tauri.release.conf.json --config "$env:RUNNER_TEMP/tauri.unsigned.conf.json" --bundles nsis
      - name: Verify packaged sidecar
        run: pwsh -NoProfile -File scripts/build-sidecar.ps1 -VerifyOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: windows-production-signing
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_SIGNING_PROVIDER: ${{ secrets.WINDOWS_SIGNING_PROVIDER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
      WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      PUBLIC_RELEASE_GATE: ${{ vars.PUBLIC_RELEASE_GATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b
        with:
          version: "0.6.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache Rust and Tauri build data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-tauri-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-
      - name: Fail closed when release credentials are missing
        shell: pwsh
        run: |
          $required = @(
            "WINDOWS_SIGNING_PROVIDER",
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
            "TAURI_UPDATER_PUBLIC_KEY",
            "TAURI_UPDATER_ENDPOINT",
            "WINDOWS_EXPECTED_PUBLISHER"
          )
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "azure") {
            $required += @(
              "AZURE_CLIENT_ID",
              "AZURE_TENANT_ID",
              "AZURE_SUBSCRIPTION_ID",
              "AZURE_ARTIFACT_SIGNING_ENDPOINT",
              "AZURE_ARTIFACT_SIGNING_ACCOUNT",
              "AZURE_ARTIFACT_SIGNING_PROFILE"
            )
          } elseif ($env:WINDOWS_SIGNING_PROVIDER -eq "pfx" -or $env:WINDOWS_SIGNING_PROVIDER -eq "selfsigned") {
            $required += @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD")
          } else {
            throw "WINDOWS_SIGNING_PROVIDER must be azure, pfx, or selfsigned."
          }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required release credential: $name"
            }
          }
      - name: Prepare Windows PFX signing certificate
        if: env.WINDOWS_SIGNING_PROVIDER == 'pfx' || env.WINDOWS_SIGNING_PROVIDER == 'selfsigned'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Add-Content -LiteralPath $env:GITHUB_ENV
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "selfsigned") {
            $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $securePassword,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - name: Verify tag source
        shell: pwsh
        run: |
          git fetch --no-tags origin refs/heads/master
          $tagCommit = git rev-parse HEAD
          $masterCommit = git rev-parse FETCH_HEAD
          if ($tagCommit -ne $masterCommit) {
            throw "Tag must point to the latest origin/master commit. Tag=$tagCommit master=$masterCommit"
          }
      - name: Prepare formal release version overlay
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart("v")
          pwsh -NoProfile -File scripts/prepare-release-version.ps1 -Version $releaseVersion
      - name: Verify synchronized release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $projectVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }
      - name: Validate previous stable release assets
        shell: pwsh
        run: |
          $previousStableTag = ""
          $candidates = gh release list --limit 20 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          foreach ($candidate in $candidates) {
            if ($candidate.isDraft -or $candidate.isPrerelease) { continue }
            $assetNames = @((gh release view $candidate.tagName --json assets | ConvertFrom-Json).assets.name)
            $hasInstaller = @($assetNames | Where-Object { $_ -like "*setup.exe" }).Count -gt 0
            $hasMetadata = @("latest.json", "checksums.sha256", "release-manifest.json") |
              Where-Object { $_ -notin $assetNames } |
              Measure-Object |
              Select-Object -ExpandProperty Count
            if ($hasInstaller -and $hasMetadata -eq 0) {
              $previousStableTag = $candidate.tagName
              break
            }
          }
          if ($previousStableTag) {
            $previousRoot = Join-Path $env:RUNNER_TEMP "previous-stable"
            New-Item -ItemType Directory -Force -Path $previousRoot | Out-Null
            gh release download $previousStableTag --dir $previousRoot `
              --pattern "*setup.exe" `
              --pattern "*.sig" `
              --pattern "latest.json" `
              --pattern "checksums.sha256" `
              --pattern "release-manifest.json"
            if ($LASTEXITCODE -ne 0) { throw "Previous stable assets could not be downloaded." }
            $previousInstaller = Get-ChildItem $previousRoot -Filter "*setup.exe" -File | Select-Object -First 1
            $previousSignature = Get-AuthenticodeSignature -FilePath $previousInstaller.FullName
            if ($null -eq $previousSignature.SignerCertificate -or
                $previousSignature.SignerCertificate.Subject -ne $env:WINDOWS_EXPECTED_PUBLISHER -or
                $null -eq $previousSignature.TimeStamperCertificate) {
              $signerSubject = if ($previousSignature.SignerCertificate) { $previousSignature.SignerCertificate.Subject } else { "<none>" }
              $timestampSubject = if ($previousSignature.TimeStamperCertificate) { $previousSignature.TimeStamperCertificate.Subject } else { "<none>" }
              throw "Previous stable installer trust verification failed: status=$($previousSignature.Status); signer=$signerSubject; timestamp=$timestampSubject."
            }
            if ($env:WINDOWS_SIGNING_PROVIDER -eq "selfsigned") {
              if ($previousSignature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT -or
                  $previousSignature.Status -ne "UnknownError") {
                throw "Previous stable self-signed installer certificate verification failed."
              }
              $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $expectedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $env:WINDOWS_CERTIFICATE_PATH,
                $securePassword,
                [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
              )
              $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
              $chain.ChainPolicy.TrustMode = [System.Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
              $chain.ChainPolicy.CustomTrustStore.Add($expectedCertificate)
              if (-not $chain.Build($previousSignature.SignerCertificate)) {
                throw "Previous stable self-signed installer certificate chain verification failed."
              }
            } elseif ($previousSignature.Status -ne "Valid") {
              throw "Previous stable installer trust verification failed: status=$($previousSignature.Status)."
            }
            $checksumEntries = @{}
            foreach ($line in Get-Content -LiteralPath "$previousRoot/checksums.sha256") {
              if ($line -match '^([A-Fa-f0-9]{64}) \*(.+)$') {
                $checksumEntries[$Matches[2]] = $Matches[1].ToUpperInvariant()
              }
            }
            $hashedAssets = Get-ChildItem $previousRoot -File |
              Where-Object { $_.Name -notin @("checksums.sha256", "release-manifest.json") }
            foreach ($asset in $hashedAssets) {
              $actualHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
              if (-not $checksumEntries.ContainsKey($asset.Name) -or $checksumEntries[$asset.Name] -ne $actualHash) {
                throw "Previous stable checksum verification failed for $($asset.Name)."
              }
            }
            $previousLatest = Get-Content -LiteralPath "$previousRoot/latest.json" -Raw | ConvertFrom-Json
            $windowsPlatform = $previousLatest.platforms.PSObject.Properties |
              Where-Object { $_.Name -like "windows-*" } |
              Select-Object -First 1
            $previousSignaturePath = "$($previousInstaller.FullName).sig"
            if ($null -eq $windowsPlatform -or -not (Test-Path -LiteralPath $previousSignaturePath)) {
              throw "Previous stable updater metadata is incomplete."
            }
            $metadataInstallerName = [Uri]::UnescapeDataString(([Uri]$windowsPlatform.Value.url).Segments[-1])
            $expectedUpdaterSignature = (Get-Content -LiteralPath $previousSignaturePath -Raw).Trim()
            if ($previousLatest.version -ne $previousStableTag.TrimStart("v") -or
                $metadataInstallerName -ne $previousInstaller.Name -or
                $windowsPlatform.Value.signature.Trim() -ne $expectedUpdaterSignature) {
              throw "Previous stable updater metadata verification failed."
            }
            $previousManifest = Get-Content -LiteralPath "$previousRoot/release-manifest.json" -Raw | ConvertFrom-Json
            if ($previousManifest.current_stable_tag -ne $previousStableTag) {
              throw "Previous stable release manifest tag does not match."
            }
          }
          "PREVIOUS_STABLE_TAG=$previousStableTag" | Add-Content -LiteralPath $env:GITHUB_ENV
          $recoveryUrl = if ($previousStableTag) { "https://github.com/${{ github.repository }}/releases/tag/$previousStableTag" } else { "" }
          "CODEX_MONITOR_RECOVERY_URL=$recoveryUrl" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Install build dependencies
        run: uv sync --dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run formal release gate
        run: pwsh -NoProfile -File scripts/check-release.ps1
      - name: Run public release gate
        if: env.PUBLIC_RELEASE_GATE == 'true'
        run: pwsh -NoProfile -File scripts/public-release-check.ps1 -Root "${{ github.workspace }}" -PublicRoot "${{ github.workspace }}"
      - name: Install official Azure Artifact Signing module
        if: env.WINDOWS_SIGNING_PROVIDER == 'azure'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser
      - name: Authenticate to Azure with GitHub OIDC
        if: env.WINDOWS_SIGNING_PROVIDER == 'azure'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build sidecar before bundle
        run: pwsh -NoProfile -File scripts/build-sidecar.ps1
      - name: Create CI-only updater and signing configuration
        shell: pwsh
        run: |
          "CODEX_SIGNING_LOG=$env:RUNNER_TEMP/signing-targets.txt" |
            Add-Content -LiteralPath $env:GITHUB_ENV
          $pwshPath = Join-Path $PSHOME "pwsh.exe"
          if (-not (Test-Path -LiteralPath $pwshPath -PathType Leaf)) {
            throw "PowerShell executable was not found at $pwshPath"
          }
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "azure") {
            $signScript = Join-Path "${{ github.workspace }}" "scripts/sign-artifact.ps1"
          } else {
            $signScript = Join-Path "${{ github.workspace }}" "scripts/sign-pfx.ps1"
          }
          # Tauri string signCommand splits on spaces; object form is required when
          # pwsh lives under "Program Files" or script paths contain whitespace.
          $signCommand = @{
            cmd = $pwshPath
            args = @(
              "-NoProfile"
              "-NonInteractive"
              "-ExecutionPolicy"
              "Bypass"
              "-File"
              $signScript
              "%1"
            )
          }
          @{
            bundle = @{ windows = @{ signCommand = $signCommand } }
            plugins = @{
              updater = @{
                endpoints = @($env:TAURI_UPDATER_ENDPOINT)
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
              }
            }
          } | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath "$env:RUNNER_TEMP/tauri.ci.release.conf.json" -Encoding utf8
          "TAURI_CI_RELEASE_CONFIG=$env:RUNNER_TEMP/tauri.ci.release.conf.json" |
            Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Sign sidecar before updater artifacts
        shell: pwsh
        run: |
          $sidecar = "frontend/src-tauri/binaries/codex-monitor-sidecar-x86_64-pc-windows-msvc/codex-monitor-sidecar-x86_64-pc-windows-msvc.exe"
          if ($env:WINDOWS_SIGNING_PROVIDER -eq "azure") {
            & scripts/sign-artifact.ps1 -FilePath $sidecar
          } else {
            & scripts/sign-pfx.ps1 -FilePath $sidecar
          }
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for sidecar." }
      - name: Build signed updater and NSIS package
        working-directory: frontend
        run: npm exec tauri build -- --config src-tauri/tauri.release.conf.json --config "$env:TAURI_CI_RELEASE_CONFIG" --bundles nsis
      - name: Verify Windows artifact signatures
        shell: pwsh
        run: |
          # Tauri restores an unsigned copy of the main binary to target/release after
          # packaging (see tauri-bundler bundle_project). Release ships the NSIS installer
          # and sidecar, so Authenticode checks must target those durable signed artifacts.
          $sidecar = Get-Item "frontend/src-tauri/binaries/codex-monitor-sidecar-x86_64-pc-windows-msvc/codex-monitor-sidecar-x86_64-pc-windows-msvc.exe"
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -File |
            Select-Object -First 1
          foreach ($artifact in @($sidecar, $installer)) {
            if ($null -eq $artifact) { throw "Expected signed Windows release artifact is missing." }
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($env:WINDOWS_SIGNING_PROVIDER -eq "selfsigned") {
              if ($signature.Status -notin @("Valid", "UnknownError")) {
                throw "Authenticode verification failed for $($artifact.Name): $($signature.Status)."
              }
            } elseif ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $($artifact.Name)."
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Signer certificate is missing for $($artifact.Name)."
            }
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_EXPECTED_PUBLISHER) {
              throw "Unexpected publisher for $($artifact.Name): $($signature.SignerCertificate.Subject)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode timestamp is missing for $($artifact.Name)."
            }
          }
          if (Test-Path -LiteralPath $env:CODEX_SIGNING_LOG) {
            $signedTargets = Get-Content -LiteralPath $env:CODEX_SIGNING_LOG |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique
            if ($signedTargets.Count -lt 4) {
              throw "Expected at least four signed targets, found $($signedTargets.Count)."
            }
            $mainExecutableTarget = $signedTargets |
              Where-Object { [IO.Path]::GetFileName($_) -eq "codex-session-monitor.exe" } |
              Select-Object -First 1
            if ($null -eq $mainExecutableTarget) {
              throw "Signed main executable target evidence is missing from the signing log."
            }
            $sidecarTarget = $signedTargets |
              Where-Object { [IO.Path]::GetFileName($_) -eq "codex-monitor-sidecar-x86_64-pc-windows-msvc.exe" } |
              Select-Object -First 1
            if ($null -eq $sidecarTarget) {
              throw "Signed sidecar target evidence is missing from the signing log."
            }
            $installerTarget = $signedTargets |
              Where-Object { [IO.Path]::GetFileName($_) -like "*setup.exe" } |
              Select-Object -First 1
            if ($null -eq $installerTarget) {
              throw "Signed NSIS setup.exe target evidence is missing from the signing log."
            }
            # Tauri/NSIS signs the embedded uninstaller as a temp nst*.tmp, not uninstall.exe.
            $uninstallerTarget = $signedTargets |
              Where-Object {
                $name = [IO.Path]::GetFileName($_)
                $name -match '^nst.+\.tmp$' -or $name -eq "uninstall.exe"
              } |
              Select-Object -First 1
            if ($null -eq $uninstallerTarget) {
              throw "Signed NSIS uninstaller target evidence is missing (expected nst*.tmp or uninstall.exe)."
            }
            Copy-Item -LiteralPath $env:CODEX_SIGNING_LOG -Destination "frontend/src-tauri/target/release/bundle/nsis/signing-targets.txt"
          } else {
            throw "Signing target evidence is missing."
          }
      - name: Create checksum and release manifest
        shell: pwsh
        run: |
          $bundleRoot = "frontend/src-tauri/target/release/bundle/nsis"
          $updaterInstaller = Get-ChildItem $bundleRoot -Filter "*setup.exe" -File | Select-Object -First 1
          if ($null -eq $updaterInstaller) { throw "Updater installer is missing." }
          $signaturePath = "$($updaterInstaller.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Updater signature is missing." }
          $signature = Get-Content -LiteralPath $signaturePath -Raw
          [ordered]@{
            version = "${{ github.ref_name }}".TrimStart("v")
            notes = "See the GitHub release notes."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($updaterInstaller.Name)"
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$bundleRoot/latest.json" -Encoding utf8
          $releaseFiles = Get-ChildItem $bundleRoot -File |
            Where-Object { $_.Name -notin @("checksums.sha256", "release-manifest.json") }
          $artifactDetails = @($releaseFiles | ForEach-Object {
            [ordered]@{
              name = $_.Name
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          })
          $releaseFiles | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash, (Split-Path -Leaf $_.Path) } |
            Set-Content -LiteralPath "$bundleRoot/checksums.sha256" -Encoding utf8
          [ordered]@{
            version = "${{ github.ref_name }}".TrimStart("v")
            current_stable_tag = "${{ github.ref_name }}"
            previous_stable_tag = $env:PREVIOUS_STABLE_TAG
            commit = "${{ github.sha }}"
            target = "windows-x86_64"
            expected_publisher = $env:WINDOWS_EXPECTED_PUBLISHER
            signature_status = "Authenticode verified; Tauri updater signature generated"
            test_evidence = @("https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            artifacts = $artifactDetails
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$bundleRoot/release-manifest.json" -Encoding utf8
      - name: Create draft release with current and previous release metadata
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes `
            "frontend/src-tauri/target/release/bundle/nsis/*"
